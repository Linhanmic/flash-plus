name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build distributables
        run: go run build.go --distro --all-platforms
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(deploy/*.zip)
          notes=".github/release-notes.md"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          elif [ -f "${notes}" ]; then
            gh release create "${tag}" "${assets[@]}" --title "Flash Plus ${tag}" --notes-file "${notes}"
          else
            gh release create "${tag}" "${assets[@]}" --title "Flash Plus ${tag}" --generate-notes
          fi
